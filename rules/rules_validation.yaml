# SOLO VALIDAZIONE — NON USARE IN PRODUZIONE.
# Soglie ridotte rispetto a rules_v0.1.yaml per generare un lotto di >=20 piste
# da sottoporre a validazione manuale (gate di docs/REGOLE_SEGNALAZIONE.md).
# La produzione resta su rules_v0.1.yaml (conservativa: 7 piste).
version: "validation"

disclaimer: "Questo non dimostra alcun illecito. Indica solo una concentrazione che merita verifica."

rules:
  - id: REGOLA-001
    name: "Concentrazione nominativi su enti diversi"
    enabled: true
    condition: "same_normalized_name appears in >= threshold distinct appointments on different entities"
    threshold: 3
    period: "same_calendar_year"
    required_fields: ["person_name", "entity_id", "year"]
    note: "Questo non dimostra alcun illecito. Indica solo una concentrazione che merita verifica."

  - id: REGOLA-002
    name: "Affidamenti diretti ripetuti dallo stesso ente"
    enabled: true
    condition: "same_awardee receives >= threshold direct awards from same entity"
    threshold: 4
    period: "12_months_rolling"
    required_fields: ["awardee", "entity_id", "award_date", "procedure_type"]
    note: "Questo non dimostra alcun illecito. Indica solo una concentrazione che merita verifica."

  - id: REGOLA-003
    name: "CIG/CUP collegati a più soggetti non spiegati"
    enabled: true
    condition: "same_cig_or_cup linked to >= threshold distinct subjects without explicit explanation in source"
    threshold: 2
    period: "full_dataset_coverage"
    required_fields: ["cig", "cup", "subject_id"]
    note: "Questo non dimostra alcun illecito. Indica solo una concentrazione che merita verifica."

  - id: REGOLA-004
    name: "Percentuale elevata di affidamenti diretti"
    enabled: false
    condition: "percentage of direct awards for an entity > threshold"
    threshold: null
    period: "calendar_year_or_12_months"
    required_fields: ["entity_id", "procedure_type", "amount"]
    note: "Questo non dimostra alcun illecito. Indica solo una concentrazione che merita verifica."
